<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A personal Safari start page built from a curated bookmark export.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23174f3f'/%3E%3Cpath d='M18 18h28v7H18zM18 30h28v7H18zM18 42h18v7H18z' fill='%23ffffff'/%3E%3Ccircle cx='47' cy='45' r='5' fill='%2328765b'/%3E%3C/svg%3E">
  <title>Gregg's Start Page</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --bg-2: #edf5f1;
      --ink: #21302f;
      --muted: #60706d;
      --line: #dbe4e1;
      --green: #28765b;
      --green-dark: #174f3f;
      --red: #b64b52;
      --shadow: 0 18px 45px rgba(31, 45, 43, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(40, 118, 91, 0.12), transparent 28rem),
        linear-gradient(315deg, rgba(47, 111, 189, 0.10), transparent 30rem),
        var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr minmax(280px, 440px);
      gap: 24px;
      align-items: end;
      padding: 18px 0 26px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--green-dark);
      font-size: 0.82rem;
      font-weight: 750;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(2.1rem, 5vw, 4.8rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .date-line {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .search-panel,
    .add-link-panel {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      backdrop-filter: blur(14px);
    }

    .search-panel {
      padding: 12px;
    }

    .search-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .search-wrap label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    #searchInput,
    .form-field input,
    .form-field select {
      width: 100%;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: #f3f7f5;
      color: var(--ink);
      outline: none;
    }

    #searchInput {
      min-height: 48px;
      padding: 0 14px;
    }

    #searchInput:focus,
    .form-field input:focus,
    .form-field select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(40, 118, 91, 0.14);
      background: #fff;
    }

    .clear-button,
    .tool-button,
    .save-button,
    .cancel-button,
    .clear-added-button,
    .restore-button,
    .move-link,
    .delete-link {
      cursor: pointer;
      font-weight: 750;
    }

    .clear-button {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--green-dark);
      padding: 0 14px;
    }

    .clear-button:hover,
    .cancel-button:hover,
    .clear-added-button:hover,
    .restore-button:hover,
    .move-link:hover {
      border-color: var(--green);
      color: var(--ink);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 0 10px;
    }

    .tool-button,
    .save-button {
      border: 1px solid var(--green-dark);
      background: var(--green-dark);
      color: #fff;
    }

    .tool-button {
      min-height: 28px;
      border-radius: 999px;
      padding: 0 12px;
      font-size: 0.88rem;
    }

    .tool-button:hover,
    .tool-button:focus-visible,
    .save-button:hover,
    .save-button:focus-visible {
      background: var(--green);
      outline: none;
    }

    .quick-row {
      margin: 12px 0 34px;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 750;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .section-label::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .most-used-grid,
    .link-grid {
      display: grid;
      gap: 12px;
    }

    .most-used-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .link-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .add-link-panel {
      margin: -10px 0 28px;
      padding: 18px;
    }

    .add-link-panel h2 {
      margin: 0 0 14px;
      font-size: 1.22rem;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .add-link-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-field {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .form-field.wide,
    .form-actions,
    .form-status {
      grid-column: 1 / -1;
    }

    .form-field input,
    .form-field select {
      min-height: 46px;
      padding: 0 12px;
      font-weight: 500;
    }

    .checkbox-field {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      color: var(--ink);
      font-size: 0.94rem;
      font-weight: 700;
    }

    .checkbox-field input {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .save-button,
    .cancel-button,
    .clear-added-button,
    .restore-button {
      min-height: 42px;
      border-radius: var(--radius);
      padding: 0 14px;
    }

    .cancel-button,
    .clear-added-button,
    .restore-button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--green-dark);
    }

    .clear-added-button {
      margin-left: auto;
    }

    .form-status {
      min-height: 20px;
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .form-status[data-state="success"] {
      color: var(--green-dark);
    }

    .form-status[data-state="error"] {
      color: #9d1f1f;
    }

    .sections {
      display: grid;
      gap: 18px;
    }

    details.link-section {
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    details.link-section[open] {
      padding-bottom: 4px;
    }

    summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      list-style: none;
      cursor: pointer;
      padding: 4px 0 14px;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .summary-title {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: baseline;
      min-width: 0;
    }

    .summary-title h2 {
      margin: 0;
      font-size: clamp(1.28rem, 2vw, 1.68rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .count {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .chevron {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--green-dark);
      font-weight: 800;
      transition: transform 180ms ease, border-color 180ms ease;
    }

    details[open] .chevron {
      transform: rotate(90deg);
    }

    .card {
      position: relative;
      min-height: 118px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 6px 16px rgba(31, 45, 43, 0.06);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .card:hover,
    .card:focus-within {
      transform: translateY(-2px);
      border-color: rgba(40, 118, 91, 0.54);
      box-shadow: 0 15px 28px rgba(31, 45, 43, 0.12);
    }

    .card.most-used {
      min-height: 104px;
      background:
        linear-gradient(135deg, rgba(40, 118, 91, 0.10), rgba(47, 111, 189, 0.06)),
        #fff;
    }

    .card.just-added {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(40, 118, 91, 0.18), 0 15px 28px rgba(31, 45, 43, 0.12);
      animation: added-pulse 1.7s ease-out;
    }

    @keyframes added-pulse {
      0% {
        transform: translateY(-2px);
      }

      100% {
        transform: translateY(0);
      }
    }

    .card-link {
      min-height: inherit;
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 12px;
      align-items: start;
      padding: 16px 76px 16px 16px;
      color: inherit;
      text-decoration: none;
    }

    .card-link:focus-visible {
      outline: 3px solid rgba(40, 118, 91, 0.24);
      outline-offset: 3px;
      border-radius: var(--radius);
    }

    .card-controls {
      position: absolute;
      top: 9px;
      right: 9px;
      display: grid;
      grid-template-columns: repeat(3, 30px);
      gap: 4px;
    }

    .move-link,
    .delete-link {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      font-size: 0.95rem;
      line-height: 1;
    }

    .move-link {
      border: 1px solid var(--line);
      color: var(--green-dark);
    }

    .move-link:disabled {
      opacity: 0.32;
      cursor: default;
    }

    .delete-link {
      border: 1px solid rgba(182, 75, 82, 0.22);
      color: var(--red);
      font-weight: 900;
    }

    .delete-link:hover,
    .delete-link:focus-visible {
      border-color: var(--red);
      background: #fff5f5;
      outline: none;
    }

    .favicon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--bg-2);
      color: var(--green-dark);
      font-size: 1rem;
      font-weight: 800;
      overflow: hidden;
    }

    .favicon img {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .card strong {
      display: block;
      margin: 1px 0 4px;
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.22;
      letter-spacing: 0;
    }

    .card small {
      display: block;
      color: var(--green-dark);
      font-size: 0.82rem;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .card p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 11px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      background: rgba(47, 111, 189, 0.10);
      color: #315d92;
      padding: 0 8px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .tag.school,
    .tag.added {
      background: rgba(40, 118, 91, 0.11);
      color: var(--green-dark);
    }

    .tag.personal {
      background: rgba(182, 75, 82, 0.11);
      color: #8a3940;
    }

    .tag.union {
      background: rgba(200, 136, 45, 0.15);
      color: #82591d;
    }

    .empty-state {
      display: none;
      margin: 28px 0 0;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.78);
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    .footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.88rem;
    }

    .compact .page {
      width: min(1440px, calc(100% - 24px));
      padding-top: 16px;
    }

    .compact .topbar {
      grid-template-columns: minmax(260px, 0.82fr) minmax(320px, 1fr);
      gap: 18px;
      padding: 10px 0 18px;
    }

    .compact h1 {
      font-size: clamp(1.8rem, 3.4vw, 3.1rem);
    }

    .compact .date-line {
      margin-top: 8px;
    }

    .compact .quick-row {
      margin-bottom: 24px;
    }

    .compact .most-used-grid,
    .compact .link-grid {
      grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
      gap: 8px;
    }

    .compact .card {
      min-height: 62px;
    }

    .compact .card-link {
      grid-template-columns: 28px 1fr;
      gap: 8px;
      padding: 9px 66px 9px 10px;
    }

    .compact .favicon {
      width: 28px;
      height: 28px;
    }

    .compact .favicon img {
      width: 18px;
      height: 18px;
    }

    .compact .card strong {
      margin-bottom: 1px;
      font-size: 0.92rem;
      line-height: 1.16;
    }

    .compact .card small {
      font-size: 0.73rem;
    }

    .compact .card p,
    .compact .tag-row {
      display: none;
    }

    .compact .card-controls {
      top: 8px;
      right: 8px;
      grid-template-columns: repeat(3, 24px);
      gap: 3px;
    }

    .compact .move-link,
    .compact .delete-link {
      width: 24px;
      height: 24px;
      font-size: 0.8rem;
    }

    .compact details.link-section {
      padding-top: 10px;
    }

    .compact summary {
      padding-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 960px) {
      .topbar,
      .compact .topbar {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .most-used-grid,
      .link-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .page,
      .compact .page {
        width: min(100% - 22px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        padding-top: 10px;
      }

      .search-wrap,
      .add-link-form {
        grid-template-columns: 1fr;
      }

      .clear-button {
        width: 100%;
      }

      .clear-added-button {
        margin-left: 0;
      }

      .most-used-grid,
      .link-grid,
      .compact .most-used-grid,
      .compact .link-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }

      .card.just-added {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <p class="eyebrow">Safari Home</p>
        <h1>Gregg's Start Page</h1>
        <p class="date-line" id="dateLine">A shorter set of links worth seeing every day.</p>
      </div>

      <section class="search-panel" aria-label="Bookmark search">
        <div class="search-wrap">
          <label for="searchInput">Search bookmarks</label>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Search bookmarks">
          <button class="clear-button" id="clearSearch" type="button">Clear</button>
        </div>
        <div class="stats" aria-live="polite">
          <span class="pill" id="matchCount">0 links</span>
          <span class="pill">Curated from Safari</span>
          <button class="tool-button" id="showAddLink" type="button">+ Add a link</button>
          <button class="tool-button hidden" id="downloadPageFile" type="button">Download updated file</button>
          <button class="tool-button" id="toggleCompact" type="button">Compact view</button>
          <button class="restore-button hidden" id="restoreDeletedLinks" type="button">Restore deleted links</button>
        </div>
      </section>
    </header>

    <section class="quick-row" aria-labelledby="mostUsedTitle">
      <h2 class="section-label" id="mostUsedTitle">Most Used</h2>
      <div class="most-used-grid" id="mostUsedGrid"></div>
    </section>

    <section class="add-link-panel hidden" id="addLinkPanel" aria-labelledby="addLinkTitle">
      <h2 id="addLinkTitle">Add a link</h2>
      <form class="add-link-form" id="addLinkForm">
        <label class="form-field" for="newLinkTitle">
          Name
          <input id="newLinkTitle" name="title" type="text" autocomplete="off" required>
        </label>
        <label class="form-field" for="newLinkUrl">
          Web address
          <input id="newLinkUrl" name="url" type="text" autocomplete="off" placeholder="example.com" required>
        </label>
        <label class="form-field" for="newLinkCategory">
          Category
          <select id="newLinkCategory" name="category" required></select>
        </label>
        <label class="form-field" for="newLinkDescription">
          Note
          <input id="newLinkDescription" name="description" type="text" autocomplete="off" placeholder="Optional">
        </label>
        <label class="checkbox-field">
          <input id="newLinkMostUsed" name="mostUsed" type="checkbox">
          Also show in Most Used
        </label>
        <div class="form-actions">
          <button class="save-button" type="submit">Save link</button>
          <button class="cancel-button" id="cancelAddLink" type="button">Cancel</button>
          <button class="clear-added-button hidden" id="clearAddedLinks" type="button">Clear added links</button>
        </div>
        <p class="form-status" id="addLinkStatus" aria-live="polite"></p>
      </form>
    </section>

    <section class="sections" id="sections"></section>
    <p class="empty-state" id="emptyState">No links match that search.</p>

    <footer class="footer">
      This single file is ready for GitHub Pages or for Safari's homepage setting.
    </footer>
  </main>

  <script type="application/json" id="savedPageState">{"customLinks":[],"deletedLinkIds":[],"linkOrder":{},"compactMode":false,"sections":{}}</script>

    const categoryNames = bookmarkSections
      .map((section) => section.name)
      .filter((name) => name !== "Daily");

    const searchInput = document.querySelector("#searchInput");
    const clearSearch = document.querySelector("#clearSearch");
    const sectionsRoot = document.querySelector("#sections");
    const mostUsedGrid = document.querySelector("#mostUsedGrid");
    const matchCount = document.querySelector("#matchCount");
    const emptyState = document.querySelector("#emptyState");

    const downloadPageFile = document.querySelector("#downloadPageFile");
    const toggleCompact = document.querySelector("#toggleCompact");
    const addLinkPanel = document.querySelector("#addLinkPanel");
    const addLinkForm = document.querySelector("#addLinkForm");
    const cancelAddLink = document.querySelector("#cancelAddLink");
    const clearAddedLinks = document.querySelector("#clearAddedLinks");
    const restoreDeletedLinks = document.querySelector("#restoreDeletedLinks");
    const addLinkStatus = document.querySelector("#addLinkStatus");
    const newLinkTitle = document.querySelector("#newLinkTitle");
    const newLinkUrl = document.querySelector("#newLinkUrl");
    const newLinkCategory = document.querySelector("#newLinkCategory");
    const newLinkDescription = document.querySelector("#newLinkDescription");
    const newLinkMostUsed = document.querySelector("#newLinkMostUsed");
    const savedPageState = document.querySelector("#savedPageState");
    const customLinksKey = "gregg-start-page-custom-links";
    const deletedLinksKey = "gregg-start-page-deleted-links";
    const orderKey = "gregg-start-page-link-order";
    const compactKey = "gregg-start-page-compact-view";
    const mostUsedContext = "Most Used";
    const embeddedState = readEmbeddedState();

    let customLinks = loadCustomLinks();
    let deletedLinkIds = loadDeletedLinkIds();
    let linkOrder = loadLinkOrder();
    const storedCompactMode = getStoredValue(compactKey);
    let compactMode = storedCompactMode === null ? embeddedState.compactMode === true : storedCompactMode === "true";
    let allLinks = [];
    let highlightedLinkId = "";
    let forcedOpenSection = "";

    function readEmbeddedState() {
      try {
        return JSON.parse(savedPageState?.textContent || "{}");
      } catch {
        return {};
      }
    }

    function getStoredValue(key) {
      try {
        return window.localStorage.getItem(key);
      } catch {
        return null;
      }
    }

    function setStoredValue(key, value) {
      try {
        window.localStorage.setItem(key, value);
        return window.localStorage.getItem(key) === value;
      } catch {
        return false;
      }
    }

    function showAddLinkStatus(message, state = "") {
      addLinkStatus.textContent = message;
      if (state) {
        addLinkStatus.dataset.state = state;
      } else {
        delete addLinkStatus.dataset.state;
      }
    }

    function makeLinkId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return `link-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function loadCustomLinks() {
      try {
        const storedValue = getStoredValue(customLinksKey);
        const embeddedLinks = Array.isArray(embeddedState.customLinks) ? embeddedState.customLinks : [];
        const source = storedValue && storedValue !== "[]" ? storedValue : JSON.stringify(embeddedLinks);
        const parsed = JSON.parse(source || "[]");
        if (!Array.isArray(parsed)) return [];
        return parsed
          .filter((link) => link && link.title && link.url)
          .map((link) => ({
            id: link.id || `custom-${makeLinkId()}`,
            title: String(link.title),
            url: String(link.url),
            description: String(link.description || "Added locally."),
            category: categoryNames.includes(link.category) ? link.category : "Personal",
            tags: ["added"],
            mostUsed: Boolean(link.mostUsed),
            custom: true
          }));
      } catch {
        return [];
      }
    }

    function loadDeletedLinkIds() {
      try {
        const storedValue = getStoredValue(deletedLinksKey);
        const embeddedIds = Array.isArray(embeddedState.deletedLinkIds) ? embeddedState.deletedLinkIds : [];
        const source = storedValue && storedValue !== "[]" ? storedValue : JSON.stringify(embeddedIds);
        const parsed = JSON.parse(source || "[]");
        return Array.isArray(parsed) ? parsed.map(String) : [];
      } catch {
        return [];
      }
    }

    function loadLinkOrder() {
      try {
        const storedValue = getStoredValue(orderKey);
        const embeddedOrder = embeddedState.linkOrder && typeof embeddedState.linkOrder === "object"
          ? embeddedState.linkOrder
          : {};
        const source = storedValue && storedValue !== "{}" ? storedValue : JSON.stringify(embeddedOrder);
        const parsed = JSON.parse(source || "{}");
        return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveCustomLinks() {
      const cleanLinks = cleanCustomLinks(customLinks);
      return setStoredValue(customLinksKey, JSON.stringify(cleanLinks));
    }

    function cleanCustomLinks(links) {
      return links.map((link) => ({
        id: link.id,
        title: link.title,
        url: link.url,
        description: link.description,
        category: link.category,
        mostUsed: Boolean(link.mostUsed)
      }));
    }

    function saveDeletedLinkIds() {
      return setStoredValue(deletedLinksKey, JSON.stringify(deletedLinkIds));
    }

    function saveLinkOrder() {
      return setStoredValue(orderKey, JSON.stringify(linkOrder));
    }

    function hasLinkOrderChanges() {
      return Object.values(linkOrder).some((ids) => Array.isArray(ids) && ids.length > 0);
    }

    function hasPageChanges() {
      return customLinks.length > 0 || deletedLinkIds.length > 0 || hasLinkOrderChanges();
    }

    function getSectionState() {
      const sections = {};
      document.querySelectorAll("details.link-section").forEach((section) => {
        sections[section.dataset.section] = section.open ? "open" : "closed";
      });
      return sections;
    }

    function portableState() {
      return {
        customLinks: cleanCustomLinks(customLinks),
        deletedLinkIds: deletedLinkIds.map(String),
        linkOrder,
        compactMode,
        sections: getSectionState()
      };
    }

    function safeJsonForHtml(value) {
      return JSON.stringify(value).replaceAll("<", "\\u003c");
    }

    function downloadUpdatedHtml() {
      const clone = document.documentElement.cloneNode(true);
      const stateNode = clone.querySelector("#savedPageState");
      const addPanel = clone.querySelector("#addLinkPanel");
      const status = clone.querySelector("#addLinkStatus");

      if (stateNode) {
        stateNode.textContent = safeJsonForHtml(portableState());
      }
      if (addPanel) {
        addPanel.classList.add("hidden");
      }
      if (status) {
        status.textContent = "";
        status.removeAttribute("data-state");
      }
      clone.querySelectorAll(".just-added").forEach((card) => card.classList.remove("just-added"));

      const file = new Blob([`<!doctype html>\n${clone.outerHTML}`], { type: "text/html" });
      const url = URL.createObjectURL(file);
      const link = document.createElement("a");
      link.href = url;
      link.download = "index.html";
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 0);
      showAddLinkStatus("Downloaded an updated index.html with your current changes.", "success");
    }

    function normalizeUrl(value) {
      const trimmed = value.trim();
      const withProtocol = /^[a-z][a-z0-9+.-]*:\/\//i.test(trimmed)
        ? trimmed
        : `https://${trimmed}`;
      const url = new URL(withProtocol);
      if (!["http:", "https:"].includes(url.protocol)) {
        throw new Error("Only web links are supported.");
      }
      return url.href;
    }

    function isDeleted(link) {
      return deletedLinkIds.includes(link.id);
    }

    function sortedLinks(links, context) {
      const savedOrder = Array.isArray(linkOrder[context]) ? linkOrder[context] : [];
      const positions = new Map(savedOrder.map((id, index) => [id, index]));
      return [...links].sort((a, b) => {
        const aPosition = positions.has(a.id) ? positions.get(a.id) : Number.MAX_SAFE_INTEGER;
        const bPosition = positions.has(b.id) ? positions.get(b.id) : Number.MAX_SAFE_INTEGER;
        if (aPosition !== bPosition) return aPosition - bPosition;
        return links.indexOf(a) - links.indexOf(b);
      });
    }

    function getSections() {
      const visibleBookmarkSections = bookmarkSections
        .map((section) => {
          const builtInLinks = section.links.filter((link) => !isDeleted(link));
          const addedLinks = customLinks.filter((link) =>
            link.category === section.name && !isDeleted(link)
          );
          return {
            ...section,
            links: sortedLinks([...builtInLinks, ...addedLinks], section.name)
          };
        })
        .filter((section) => section.links.length > 0);
      return visibleBookmarkSections;
    }

    function refreshLinks() {
      allLinks = getSections().flatMap((section) =>
        section.links.map((link) => ({ ...link, section: section.name }))
      );
    }

    function updateLinkTools() {
      clearAddedLinks.classList.toggle("hidden", customLinks.length === 0);
      restoreDeletedLinks.classList.toggle("hidden", deletedLinkIds.length === 0);
      downloadPageFile.classList.toggle("hidden", !hasPageChanges());
      document.body.classList.toggle("compact", compactMode);
      toggleCompact.textContent = compactMode ? "Detailed view" : "Compact view";
    }

    function renderPage() {
      refreshLinks();
      renderMostUsed();
      renderSections();
      updateLinkTools();
      applyFilter();
    }

    function renderCategoryOptions() {
      newLinkCategory.innerHTML = categoryNames
        .map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`)
        .join("");
      newLinkCategory.value = "Personal";
    }

    const hostFromUrl = (url) => {
      try {
        return new URL(url).hostname.replace(/^www\./, "");
      } catch {
        return url;
      }
    };

    const faviconUrl = (url) => {
      const encoded = encodeURIComponent(url);
      return `https://www.google.com/s2/favicons?domain_url=${encoded}&sz=64`;
    };

    const escapeHtml = (value) =>
      String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    function cardTemplate(link, variant, context, index, count) {
      const host = hostFromUrl(link.url);
      const tags = (link.tags || [])
        .map((tag) => `<span class="tag ${escapeHtml(tag)}">${escapeHtml(tag)}</span>`)
        .join("");
      const initial = escapeHtml(link.title.slice(0, 1).toUpperCase());
      const searchText = `${link.title} ${link.description} ${link.section || ""} ${host} ${(link.tags || []).join(" ")}`.toLowerCase();

      return `
        <article class="card ${variant || ""} ${link.id === highlightedLinkId ? "just-added" : ""}" data-id="${escapeHtml(link.id)}" data-custom="${link.custom ? "true" : "false"}" data-search="${escapeHtml(searchText)}">
          <a class="card-link" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">
            <span class="favicon" aria-hidden="true">
              <img src="${faviconUrl(link.url)}" alt="" loading="lazy" onerror="this.remove(); this.parentElement.textContent='${initial}';">
            </span>
            <span>
              <strong>${escapeHtml(link.title)}</strong>
              <small>${escapeHtml(host)}</small>
              <p>${escapeHtml(link.description)}</p>
              ${tags ? `<span class="tag-row">${tags}</span>` : ""}
            </span>
          </a>
          <span class="card-controls">
            <button class="move-link" type="button" data-move-id="${escapeHtml(link.id)}" data-move-context="${escapeHtml(context)}" data-move-direction="up" aria-label="Move ${escapeHtml(link.title)} up" title="Move up" ${index === 0 ? "disabled" : ""}>^</button>
            <button class="move-link" type="button" data-move-id="${escapeHtml(link.id)}" data-move-context="${escapeHtml(context)}" data-move-direction="down" aria-label="Move ${escapeHtml(link.title)} down" title="Move down" ${index === count - 1 ? "disabled" : ""}>v</button>
            <button class="delete-link" type="button" data-delete-id="${escapeHtml(link.id)}" aria-label="Delete ${escapeHtml(link.title)}" title="Delete this link">x</button>
          </span>
        </article>
      `;
    }

    function groupLinksForContext(context) {
      if (context === mostUsedContext) {
        return sortedLinks(allLinks.filter((link) => link.mostUsed), mostUsedContext);
      }
      const section = getSections().find((item) => item.name === context);
      return section ? sortedLinks(section.links.filter((link) => !link.mostUsed || link.custom), context) : [];
    }

    function moveLink(id, context, direction) {
      const group = groupLinksForContext(context);
      const currentIndex = group.findIndex((link) => link.id === id);
      if (currentIndex === -1) return;
      const nextIndex = direction === "up" ? currentIndex - 1 : currentIndex + 1;
      if (nextIndex < 0 || nextIndex >= group.length) return;
      const ids = group.map((link) => link.id);
      const [moved] = ids.splice(currentIndex, 1);
      ids.splice(nextIndex, 0, moved);
      linkOrder[context] = ids;
      saveLinkOrder();
      renderPage();
    }

    function placeLinkFirst(id, context) {
      const ids = groupLinksForContext(context)
        .map((link) => link.id)
        .filter((linkId) => linkId !== id);
      linkOrder[context] = [id, ...ids];
      saveLinkOrder();
    }

    function attachCardHandlers(root = document) {
      root.querySelectorAll("[data-delete-id]").forEach((button) => {
        button.addEventListener("click", () => {
          const id = button.dataset.deleteId;
          const link = allLinks.find((item) => item.id === id);
          if (!link) return;
          const shouldDelete = window.confirm(`Delete "${link.title}" from this page?`);
          if (!shouldDelete) return;

          if (link.custom) {
            customLinks = customLinks.filter((item) => item.id !== id);
            const saved = saveCustomLinks();
            showAddLinkStatus(
              saved ? "Added link deleted." : "Added link deleted for now, but Safari did not allow that change to be saved.",
              saved ? "success" : "error"
            );
          } else {
            if (!deletedLinkIds.includes(id)) {
              deletedLinkIds.push(id);
            }
            const saved = saveDeletedLinkIds();
            showAddLinkStatus(
              saved
                ? "Link hidden. You can restore hidden links from the top of the page."
                : "Link hidden for now, but Safari did not allow that change to be saved.",
              saved ? "success" : "error"
            );
          }
          renderPage();
        });
      });

      root.querySelectorAll("[data-move-id]").forEach((button) => {
        button.addEventListener("click", () => {
          moveLink(button.dataset.moveId, button.dataset.moveContext, button.dataset.moveDirection);
        });
      });
    }

    function renderMostUsed() {
      const links = sortedLinks(allLinks.filter((link) => link.mostUsed), mostUsedContext);
      mostUsedGrid.innerHTML = links
        .map((link, index) => cardTemplate(link, "most-used", mostUsedContext, index, links.length))
        .join("");
      attachCardHandlers(mostUsedGrid);
    }

    function renderSections() {
      sectionsRoot.innerHTML = getSections()
        .map((section, index) => {
          const sectionLinks = sortedLinks(
            section.links.filter((link) => !link.mostUsed || link.custom),
            section.name
          );
          if (!sectionLinks.length) return "";
          const saved = getStoredValue(`section:${section.name}`) ?? embeddedState.sections?.[section.name] ?? null;
          const open = forcedOpenSection === section.name || (saved === null ? index < 5 : saved === "open");
          return `
            <details class="link-section" data-section="${escapeHtml(section.name)}" ${open ? "open" : ""}>
              <summary>
                <span class="summary-title">
                  <h2>${escapeHtml(section.name)}</h2>
                  <span class="count">${sectionLinks.length} link${sectionLinks.length === 1 ? "" : "s"}</span>
                </span>
                <span class="chevron" aria-hidden="true">></span>
              </summary>
              <div class="link-grid">
                ${sectionLinks.map((link, itemIndex) => cardTemplate({ ...link, section: section.name }, "", section.name, itemIndex, sectionLinks.length)).join("")}
              </div>
            </details>
          `;
        })
        .join("");

      document.querySelectorAll("details.link-section").forEach((detail) => {
        detail.addEventListener("toggle", () => {
          if (!searchInput.value.trim()) {
            setStoredValue(
              `section:${detail.dataset.section}`,
              detail.open ? "open" : "closed"
            );
          }
        });
      });
      attachCardHandlers(sectionsRoot);
    }

    function applyFilter() {
      const query = searchInput.value.trim().toLowerCase();
      let visible = 0;

      document.querySelectorAll(".card").forEach((card) => {
        const isMatch = !query || card.dataset.search.includes(query);
        card.classList.toggle("hidden", !isMatch);
        if (isMatch) visible += 1;
      });

      document.querySelectorAll("details.link-section").forEach((section) => {
        const sectionCards = [...section.querySelectorAll(".card")];
        const hasMatch = sectionCards.some((card) => !card.classList.contains("hidden"));
        section.classList.toggle("hidden", !hasMatch);
        if (query && hasMatch) section.open = true;
      });

      const quickMatches = [...document.querySelectorAll(".quick-row .card")]
        .some((card) => !card.classList.contains("hidden"));
      document.querySelector(".quick-row").classList.toggle("hidden", query && !quickMatches);
      matchCount.textContent = query
        ? `${visible} match${visible === 1 ? "" : "es"}`
        : `${allLinks.length} links`;
      emptyState.style.display = visible === 0 ? "block" : "none";
    }

    function revealLink(id) {
      requestAnimationFrame(() => {
        const card = [...document.querySelectorAll(".card")].find((item) => item.dataset.id === id);
        if (!card) return;
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        window.setTimeout(() => {
          card.classList.remove("just-added");
          if (highlightedLinkId === id) {
            highlightedLinkId = "";
          }
        }, 2200);
      });
    }

    function setDateLine() {
      const formatter = new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric"
      });
      dateLine.textContent = formatter.format(new Date());
    }

    function showPageTop() {
      window.scrollTo({ top: 0, left: 0 });
    }

    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }

    renderCategoryOptions();
    setDateLine();
    renderPage();
    showPageTop();
    requestAnimationFrame(showPageTop);
    window.addEventListener("load", () => setTimeout(showPageTop, 0));
    window.addEventListener("pageshow", showPageTop);

    searchInput.addEventListener("input", applyFilter);
    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      applyFilter();
      searchInput.focus();
    });

    showAddLink.addEventListener("click", () => {
      addLinkPanel.classList.toggle("hidden");
      showAddLinkStatus("");
      if (!addLinkPanel.classList.contains("hidden")) {
        newLinkTitle.focus();
      }
    });

    downloadPageFile.addEventListener("click", downloadUpdatedHtml);

    toggleCompact.addEventListener("click", () => {
      compactMode = !compactMode;
      setStoredValue(compactKey, String(compactMode));
      updateLinkTools();
    });

    cancelAddLink.addEventListener("click", () => {
      addLinkPanel.classList.add("hidden");
      addLinkForm.reset();
      newLinkCategory.value = "Personal";
      showAddLinkStatus("");
    });

    clearAddedLinks.addEventListener("click", () => {
      if (!customLinks.length) return;
      const shouldClear = window.confirm("Remove all links you added from this browser?");
      if (!shouldClear) return;
      customLinks = [];
      const saved = saveCustomLinks();
      showAddLinkStatus(
        saved ? "Added links cleared." : "Added links cleared for now, but Safari did not allow that change to be saved.",
        saved ? "success" : "error"
      );
      renderPage();
    });

    restoreDeletedLinks.addEventListener("click", () => {
      if (!deletedLinkIds.length) return;
      deletedLinkIds = [];
      const saved = saveDeletedLinkIds();
      showAddLinkStatus(
        saved ? "Deleted links restored." : "Deleted links restored for now, but Safari did not allow that change to be saved.",
        saved ? "success" : "error"
      );
      renderPage();
    });

    addLinkForm.addEventListener("submit", (event) => {
      event.preventDefault();

      let url;
      try {
        url = normalizeUrl(newLinkUrl.value);
      } catch {
        showAddLinkStatus("Enter a valid web address.", "error");
        newLinkUrl.focus();
        return;
      }

      const title = newLinkTitle.value.trim();
      if (!title) {
        showAddLinkStatus("Enter a name for the link.", "error");
        newLinkTitle.focus();
        return;
      }

      const category = categoryNames.includes(newLinkCategory.value)
        ? newLinkCategory.value
        : "Personal";
      const newLink = {
        id: `custom-${makeLinkId()}`,
        title,
        url,
        description: newLinkDescription.value.trim() || "Added locally.",
        category,
        tags: ["added"],
        mostUsed: newLinkMostUsed.checked,
        custom: true
      };

      searchInput.value = "";
      forcedOpenSection = category;
      highlightedLinkId = newLink.id;
      customLinks.push(newLink);
      placeLinkFirst(newLink.id, category);
      if (newLink.mostUsed) {
        placeLinkFirst(newLink.id, mostUsedContext);
      }
      const persisted = saveCustomLinks();
      if (persisted) {
        addLinkForm.reset();
        newLinkCategory.value = "Personal";
        addLinkPanel.classList.add("hidden");
        showAddLinkStatus(
          newLink.mostUsed
            ? `Link added to ${category} and Most Used.`
            : `Link added to ${category}.`,
          "success"
        );
      } else {
        showAddLinkStatus(
          "Link added for this tab, but Safari did not allow it to be saved. Try opening the page from its GitHub Pages web address instead of the local file.",
          "error"
        );
      }
      renderPage();
      revealLink(newLink.id);
    });

    window.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        searchInput.focus();
      }
    });
  </script>
</body>
</html>
